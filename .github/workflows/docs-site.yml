name: Build & Deploy Docs (MkDocs)

on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main]
    types:
      - completed
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install documentation build dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure deployment SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_NEW_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_NEW_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Fetch latest release.json from VPS (if present)
        env:
          VPS_HOST: ${{ secrets.VPS_NEW_HOST }}
          VPS_USER: ${{ secrets.VPS_NEW_USER }}
        run: |
          set -euo pipefail
          if ssh -i ~/.ssh/vps_key -p 22 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" test -f /var/www/rewatch.kirilov.dev/web/release.json; then
            scp -P 22 -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST":/var/www/rewatch.kirilov.dev/web/release.json ./release.json
          else
            echo "{}" > release.json
          fi

      - name: Build MkDocs site with current extension screenshots
        run: npm run docs:build

      - name: Sync site to VPS (preserve downloads & release.json)
        env:
          VPS_HOST: ${{ secrets.VPS_NEW_HOST }}
          VPS_USER: ${{ secrets.VPS_NEW_USER }}
        run: |
          set -euo pipefail
          rsync -avz --delete --chmod=D755,F644 \
            --exclude 'downloads/' \
            --exclude 'release.json' \
            --exclude 'community/' \
            --exclude '/[0-9]*.[0-9]*.[0-9]*/' \
            --exclude '/stats/' \
            --exclude '/error/' \
            --exclude '/.ht*' \
            -e "ssh -i ~/.ssh/vps_key -p 22 -o StrictHostKeyChecking=yes" \
            site/ "$VPS_USER@$VPS_HOST":/var/www/rewatch.kirilov.dev/web/
