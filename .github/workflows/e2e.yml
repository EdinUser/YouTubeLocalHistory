# Optional deterministic Chromium E2E: run manually from the Actions tab.
# This workflow intentionally replays fixtures and does not contact YouTube.

name: E2E (offline Playwright)

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build unpacked extension
        run: npm run build:e2e

      - name: Run offline Chromium extension E2E tests
        run: npm run test:e2e:offline
