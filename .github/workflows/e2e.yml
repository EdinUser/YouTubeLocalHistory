# Optional E2E: run manually from the Actions tab (workflow_dispatch).
# Requires a virtual display for headed Chromium + extensions on Linux (xvfb).

name: E2E (Playwright)

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build unpacked extension
        run: npm run build:e2e

      - name: Run Chromium extension E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
